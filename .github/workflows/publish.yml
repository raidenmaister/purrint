name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build package and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Requerido para autenticación OIDC Trusted Publisher de PyPI
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest Pillow bleak

      - name: Run tests before publishing
        run: |
          pytest tests

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Nota: Si usas Trusted Publishing (recomendado), no necesitas configurar contraseñas ni tokens.
        # Si prefieres usar un API token tradicional, descomenta las líneas siguientes:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
