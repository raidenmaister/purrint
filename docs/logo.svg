<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="140">
  <defs>
    <linearGradient id="grad-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(20, 15)">
    <!-- Paper emerging -->
    <rect x="30" y="8" width="50" height="42" rx="4" fill="url(#grad-paper)" filter="url(#shadow)"/>
    <!-- Paper print lines -->
    <line x1="38" y1="20" x2="68" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="38" y1="27" x2="72" y2="27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="38" y1="34" x2="56" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Printer main body -->
    <rect x="15" y="42" width="80" height="64" rx="14" fill="url(#grad-body)" filter="url(#shadow)"/>

    <!-- Printer slot -->
    <rect x="25" y="46" width="60" height="6" rx="3" fill="#0f172a" opacity="0.6"/>

    <!-- Status indicator LED -->
    <circle cx="32" cy="74" r="3.5" fill="#10b981"/>
    <!-- Feed button indicator -->
    <circle cx="78" cy="74" r="5" fill="#6366f1"/>
    <circle cx="78" cy="74" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="145" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#38bdf8">purr<tspan fill="#6366f1">int</tspan></text>
</svg>
